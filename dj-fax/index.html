<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DJ Fax</title>
<meta name="description" content="DJ Fax – Fredrik Våland. Tlf. 473 81 194.">
<meta property="og:title" content="DJ Fax">
<meta property="og:image" content="img/dj-fax-og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111;--mut:#6f6f6f;--line:#e6e6e6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',Helvetica,Arial,sans-serif;font-stretch:108%;font-size:17px;line-height:1.65;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.up{text-transform:uppercase;letter-spacing:.16em}
.demo{background:#111;color:#fff;text-align:center;font-size:11px;font-weight:500;letter-spacing:.2em;padding:6px}

.bar{position:sticky;top:0;z-index:20;background:#fff;padding:14px 24px;display:flex;justify-content:center}
.bar.skygge{box-shadow:0 1px 0 var(--line)}
.meny{display:flex;gap:clamp(22px,4vw,44px)}
.meny a{font-size:12px;font-weight:500;padding:12px 2px 8px;border-bottom:2px solid transparent;min-height:44px;display:inline-flex;align-items:center}
.meny a:hover,.meny a[aria-current="page"]{border-color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

section[hidden]{display:none}

.hero{height:calc(100svh - 104px);min-height:460px;overflow:hidden;background:#f2f2f2}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.navn{text-align:center;padding:clamp(40px,7vw,80px) 24px 0}
.navn h1{font-size:clamp(52px,9vw,112px);font-weight:500;font-stretch:125%;line-height:1;letter-spacing:.06em;text-transform:uppercase}
.navn p{margin-top:16px;color:var(--mut);font-size:12px;font-weight:500}

.blokk{max-width:1100px;margin:0 auto;padding:clamp(64px,10vw,120px) 24px 0;text-align:center}
.blokk h2{font-size:clamp(34px,5vw,56px);font-weight:500;font-stretch:125%;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.blokk .tekst{margin:26px auto 0;max-width:34em;color:#333;font-size:19px}
.bilder{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:44px}
.bilder img{width:100%;height:clamp(320px,42vw,560px);object-fit:cover}
.bilder .dj{object-position:50% 25%}

.knapper{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:34px}
.knapp{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;border:1px solid var(--ink);background:none;color:var(--ink);font:inherit;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.16em;cursor:pointer;transition:background .2s,color .2s}
.knapp:hover{background:var(--ink);color:#fff}
.knapp.fylt{background:var(--ink);color:#fff}
.knapp.fylt:hover{background:#333}
.knapp:disabled{opacity:.6;cursor:default}

.kontakt{max-width:1100px;margin:0 auto;padding:clamp(48px,8vw,96px) 24px 0}
.kontakt h1{text-align:center;font-size:clamp(44px,7vw,80px);font-weight:500;font-stretch:125%;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.k-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(32px,6vw,88px);margin-top:clamp(40px,6vw,72px);align-items:start}
.k-info h2{font-size:22px;font-weight:500;font-stretch:115%;letter-spacing:.04em}
.k-info dl{margin-top:22px;display:grid;gap:18px}
.k-info dt{font-size:11px;font-weight:500;color:var(--mut)}
.k-info dd{font-size:19px;margin-top:2px;overflow-wrap:anywhere}
.k-info dd a{border-bottom:1px solid var(--ink)}
.k-bilde{margin-top:34px;aspect-ratio:4/5;overflow:hidden}
.k-bilde img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
form{display:grid;gap:22px}
.felt{display:grid;gap:6px}
.felt label{font-size:11px;font-weight:500;color:var(--mut)}
input,textarea{font:inherit;font-size:17px;letter-spacing:.01em;color:var(--ink);border:0;border-bottom:1px solid #9a9a9a;padding:10px 0;background:none;border-radius:0;outline-offset:3px}
input:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:140px;resize:vertical}
.to{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.skjult{position:absolute;left:-9999px}
form .knapp{justify-self:start}
.feil{color:#b3261e;font-size:15px}
.feil:empty{display:none}
.takk{border:1px solid var(--ink);padding:32px;text-align:center}
.takk h2{font-size:22px;font-weight:500;font-stretch:115%}
.takk p{color:var(--mut);margin-top:6px}

footer{margin-top:clamp(72px,10vw,120px);border-top:1px solid var(--line);padding:28px 24px;text-align:center;color:var(--mut);font-size:11px;font-weight:500}

@media (max-width:760px){
  .hero{height:auto;aspect-ratio:3/4;min-height:0}
  .bilder{grid-template-columns:1fr}
  .bilder img{height:auto;aspect-ratio:4/5}
  .k-grid{grid-template-columns:1fr}
  .k-bilde{display:none}
  .to{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="demo up">Demo</div>

<header class="bar" id="bar">
  <nav class="meny up" aria-label="Hovedmeny">
    <a href="#forside">Forside</a>
    <a href="#kontakt">Kontakt</a>
  </nav>
</header>

<main>
  <section id="side-forside" aria-label="Forside">
    <div class="hero"><img src="img/dj-fax.jpg" alt="DJ Fax bak en julepyntet DJ-pult" width="1050" height="1400"></div>
    <div class="navn">
      <h1>DJ Fax</h1>
      <p class="up">Fredrik Våland</p>
      <div class="knapper"><a class="knapp fylt" href="#kontakt">Kontakt</a><a class="knapp" href="tel:+4747381194">Ring 473 81 194</a></div>
    </div>

    <div class="blokk">
      <h2>Om meg</h2>
      <p class="tekst">Jeg jobber som teknisk tegner</p>
    </div>

    <div class="blokk">
      <h2>Bilder</h2>
      <div class="bilder">
        <img class="dj" src="img/dj-fax.jpg" alt="DJ Fax i nissedrakt bak DJ-pulten" loading="lazy" width="1050" height="1400">
        <img src="img/vei.jpg" alt="Vei som forsvinner inn i tåka" loading="lazy" width="1280" height="853">
      </div>
    </div>
  </section>

  <section id="side-kontakt" aria-label="Kontakt" hidden>
    <div class="kontakt">
      <h1>Kontakt</h1>
      <div class="k-grid">
        <div class="k-info">
          <h2>Fredrik Våland</h2>
          <dl>
            <div><dt class="up">Tlf.</dt><dd><a href="tel:+4747381194">473 81 194</a></dd></div>
            <div><dt class="up">E-post</dt><dd><a href="mailto:kontaktfredrik@proton.me">kontaktfredrik@proton.me</a></dd></div>
          </dl>
          <div class="k-bilde"><img src="img/dj-fax.jpg" alt="" loading="lazy" width="1050" height="1400"></div>
        </div>

        <div>
          <form id="skjema" action="https://formsubmit.co/kontaktfredrik@proton.me" method="POST" novalidate>
            <input type="hidden" name="_subject" value="Ny melding fra DJ Fax-nettsiden">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <input type="text" name="_honey" class="skjult" tabindex="-1" autocomplete="off" aria-hidden="true">
            <div class="to">
              <div class="felt"><label class="up" for="f-navn">Navn</label><input id="f-navn" name="Navn" autocomplete="name" required></div>
              <div class="felt"><label class="up" for="f-epost">E-post</label><input id="f-epost" name="email" type="email" autocomplete="email" required></div>
            </div>
            <div class="felt"><label class="up" for="f-emne">Emne</label><input id="f-emne" name="Emne" required></div>
            <div class="felt"><label class="up" for="f-melding">Melding</label><textarea id="f-melding" name="Melding" required></textarea></div>
            <p class="feil" id="feil" role="alert"></p>
            <button class="knapp fylt" type="submit">Send melding</button>
          </form>
          <div class="takk" id="takk" hidden>
            <h2>Takk for meldingen!</h2>
            <p>Du hører fra meg så snart som mulig.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="up">© DJ Fax · Fredrik Våland</footer>

<script>
(function(){
  var ids=['forside','kontakt'];
  function vis(){
    var id=location.hash==='#kontakt'?'kontakt':'forside';
    ids.forEach(function(x){document.getElementById('side-'+x).hidden=(x!==id)});
    document.querySelectorAll('.meny a').forEach(function(a){
      if(a.getAttribute('href')==='#'+id) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
    requestAnimationFrame(function(){window.scrollTo({top:0,behavior:'instant'})});
  }
  window.addEventListener('hashchange',vis); vis();
  var bar=document.getElementById('bar');
  addEventListener('scroll',function(){bar.classList.toggle('skygge',scrollY>10)},{passive:true});

  var f=document.getElementById('skjema'), feil=document.getElementById('feil');
  f.addEventListener('submit',function(e){
    e.preventDefault(); feil.textContent='';
    var mangler=[].slice.call(f.querySelectorAll('[required]')).filter(function(el){return !el.value.trim()});
    if(mangler.length){feil.textContent='Fyll ut alle feltene.'; mangler[0].focus(); return;}
    if(!/^\S+@\S+\.\S+$/.test(f.email.value)){feil.textContent='Sjekk e-postadressen.'; f.email.focus(); return;}
    var knapp=f.querySelector('button'); knapp.disabled=true; knapp.textContent='Sender …';
    fetch('https://formsubmit.co/ajax/kontaktfredrik@proton.me',{method:'POST',headers:{'Accept':'application/json'},body:new FormData(f)})
      .then(function(r){if(!r.ok) throw 0; f.hidden=true; document.getElementById('takk').hidden=false;})
      .catch(function(){knapp.disabled=false; knapp.textContent='Send melding'; feil.textContent='Noe gikk galt. Prøv igjen, eller send e-post til kontaktfredrik@proton.me.';});
  });
})();
</script>
</body>
</html>
